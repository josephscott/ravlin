# nginx in front of php-fpm for the ravlin example app and the server tests — for development and tests only.
# {port}, {fpm_port}, {run}, {root} and {script} are filled in by `make serve-fpm` and tests/runtime/sapi-server-tests.php
# (paths must not contain spaces, ';' or '$', which break this config, nor '#', '&' or '\', which break the Makefile's sed).
# Every request goes to ravlin: static files are out of scope, and serving public/ directly would expose index.php's source.
# Not production-ready: FastCGI on TCP lets any local user run code as the php-fpm user (use a Unix socket with tight
# permissions), there is no server_name or default server rejecting unknown hosts (DNS rebinding; SERVER_NAME is the
# client's Host), no timeouts beyond the defaults, and nginx's own 400/413/502 pages carry none of ravlin's headers.
daemon off;
worker_processes 1;
pid {run}/nginx.pid;
error_log {run}/nginx-error.log;

events {
	worker_connections 64;
}

http {
	access_log off;
	server_tokens off;
	client_body_temp_path {run}/client-body;
	fastcgi_temp_path {run}/fastcgi;
	proxy_temp_path {run}/proxy;
	uwsgi_temp_path {run}/uwsgi;
	scgi_temp_path {run}/scgi;

	server {
		listen 127.0.0.1:{port};

		location / {
			fastcgi_pass 127.0.0.1:{fpm_port};
			fastcgi_param SCRIPT_FILENAME {script};
			fastcgi_param SCRIPT_NAME /index.php;
			fastcgi_param DOCUMENT_ROOT {root};
			fastcgi_param GATEWAY_INTERFACE CGI/1.1;
			fastcgi_param SERVER_SOFTWARE nginx;
			fastcgi_param REQUEST_SCHEME $scheme;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_param REQUEST_URI $request_uri;
			fastcgi_param QUERY_STRING $query_string;
			fastcgi_param CONTENT_TYPE $content_type if_not_empty;
			fastcgi_param CONTENT_LENGTH $content_length if_not_empty;
			fastcgi_param SERVER_PROTOCOL $server_protocol;
			fastcgi_param SERVER_NAME $host;
			fastcgi_param SERVER_PORT $server_port;
			fastcgi_param REMOTE_ADDR $remote_addr;
			fastcgi_param REMOTE_PORT $remote_port;
			fastcgi_param SERVER_ADDR $server_addr;
			fastcgi_param HTTPS $https if_not_empty;
		}
	}
}
