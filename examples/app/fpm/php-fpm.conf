; php-fpm pool for the ravlin example app and the server tests — for development and tests only.
; {fpm_port} and {run} are filled in by `make serve-fpm` and tests/runtime/sapi-server-tests.php.
; TCP, not a Unix socket: macOS limits socket paths to 104 bytes and its temp directories are long — in production
; use a Unix socket, size pm for the load, and set request_terminate_timeout (max_execution_time ignores I/O waits).
; PHP's own error_log setting decides where ravlin's log lines go; when it's unset they reach nginx's error log.
[global]
pid = {run}/php-fpm.pid
error_log = {run}/php-fpm.log
daemonize = no

[app]
listen = 127.0.0.1:{fpm_port}
pm = static
pm.max_children = 2
